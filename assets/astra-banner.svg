<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 260" width="100%" height="auto" fill="none">
  <defs>
    <!-- Astra Neon Flow Gradient -->
    <linearGradient id="astraBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe">
        <animate attributeName="stop-color" values="#00f2fe;#7928ca;#ff0080;#00f2fe" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#7928ca">
        <animate attributeName="stop-color" values="#7928ca;#ff0080;#00f2fe;#7928ca" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#ff0080">
        <animate attributeName="stop-color" values="#ff0080;#00f2fe;#7928ca;#ff0080" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Deep Space Background Gradient -->
    <linearGradient id="spaceBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14" />
      <stop offset="50%" stop-color="#0e131f" />
      <stop offset="100%" stop-color="#06080d" />
    </linearGradient>

    <!-- Bento Box Glass Gradient -->
    <linearGradient id="bentoBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161f30" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0d1424" stop-opacity="0.5" />
    </linearGradient>

    <!-- Shimmer Sweep -->
    <linearGradient id="shimmerSweep" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="50%" stop-color="#00f2fe" stop-opacity="0.12">
        <animate attributeName="offset" values="-1; 2" dur="4s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Shadow filter -->
    <filter id="astraShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.7" />
    </filter>

    <filter id="neonGlow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .astra-title { font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 800; font-size: 21px; fill: #ffffff; letter-spacing: -0.5px; }
    .astra-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; fill: #8b9bb4; }
    .bento-header { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 700; font-size: 14px; }
    .bento-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11.5px; fill: #8b9bb4; line-height: 1.4; }
    .status-text { font-family: 'SF Mono', Consolas, Monaco, monospace; font-size: 11px; font-weight: 700; fill: #00f2fe; letter-spacing: 0.5px; }
    
    @keyframes radarPulse {
      0% { r: 4px; opacity: 1; }
      100% { r: 13px; opacity: 0; }
    }

    @keyframes starTwinkle {
      0%, 100% { opacity: 0.2; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.3); }
    }

    .radar-circle {
      animation: radarPulse 2.2s cubic-bezier(0, 0.2, 0.8, 1) infinite;
    }

    .star-1 { transform-origin: 150px 45px; animation: starTwinkle 3s ease-in-out infinite; }
    .star-2 { transform-origin: 480px 25px; animation: starTwinkle 4s ease-in-out infinite 1s; }
    .star-3 { transform-origin: 750px 70px; animation: starTwinkle 3.5s ease-in-out infinite 2s; }
  </style>

  <!-- Outer Astra Card Frame -->
  <rect x="5" y="5" width="840" height="250" rx="16" fill="url(#spaceBg)" stroke="url(#astraBorder)" stroke-width="2" filter="url(#astraShadow)" />
  <rect x="5" y="5" width="840" height="250" rx="16" fill="url(#shimmerSweep)" />

  <!-- Ambient Stars -->
  <circle cx="150" cy="45" r="1.5" fill="#00f2fe" class="star-1" />
  <circle cx="480" cy="25" r="2" fill="#ff0080" class="star-2" />
  <circle cx="750" cy="70" r="1.5" fill="#7928ca" class="star-3" />
  <circle cx="280" cy="80" r="1" fill="#ffffff" opacity="0.4" />
  <circle cx="620" cy="40" r="1" fill="#ffffff" opacity="0.3" />

  <!-- HUD Corner Accents -->
  <path d="M 20 30 L 20 20 L 30 20" stroke="#00f2fe" stroke-width="2" fill="none" opacity="0.8" />
  <path d="M 830 30 L 830 20 L 820 20" stroke="#00f2fe" stroke-width="2" fill="none" opacity="0.8" />
  <path d="M 20 230 L 20 240 L 30 240" stroke="#00f2fe" stroke-width="2" fill="none" opacity="0.8" />
  <path d="M 830 230 L 830 240 L 820 240" stroke="#00f2fe" stroke-width="2" fill="none" opacity="0.8" />

  <!-- Header Section -->
  <g transform="translate(36, 32)">
    <!-- Tech Icon Badge -->
    <rect x="0" y="0" width="46" height="46" rx="12" fill="#141c2e" stroke="#23324d" stroke-width="1.5" />
    <text x="13" y="30" font-size="20">⚡</text>
    
    <!-- Title and Subtitle -->
    <text x="60" y="22" class="astra-title">Algorithmic Problem Solving Engine</text>
    <text x="60" y="42" class="astra-sub">Continuous Learning • Optimal Complexity • Multi-Paradigm Excellence</text>
  </g>

  <!-- Live Status Badge (Top Right) -->
  <g transform="translate(620, 36)">
    <rect x="0" y="0" width="194" height="34" rx="17" fill="#0d1524" stroke="#1d2c47" stroke-width="1.2" />
    <circle cx="20" cy="17" r="7" stroke="#00f2fe" class="radar-circle" fill="none" />
    <circle cx="20" cy="17" r="4" fill="#00f2fe" />
    <text x="36" y="21" class="status-text">SYSTEM: ACTIVE DSA</text>
  </g>

  <!-- Bento Grid Row -->
  <!-- Box 1: Core Algorithms -->
  <g transform="translate(36, 104)">
    <rect x="0" y="0" width="244" height="106" rx="12" fill="url(#bentoBg)" stroke="#1e2c45" stroke-width="1" />
    <rect x="14" y="14" width="30" height="30" rx="8" fill="#00f2fe" fill-opacity="0.15" />
    <text x="21" y="35" font-size="15">🧠</text>
    <text x="54" y="28" class="bento-header" fill="#00f2fe">Data Structures</text>
    <text x="54" y="44" class="bento-text" fill="#8b9bb4">Trees, Graphs, HashMaps</text>
    <text x="14" y="82" class="bento-text" fill="#a5b4fc">Pattern recognition &amp; clean abstractions</text>
  </g>

  <!-- Box 2: Time & Space Optimization -->
  <g transform="translate(303, 104)">
    <rect x="0" y="0" width="244" height="106" rx="12" fill="url(#bentoBg)" stroke="#1e2c45" stroke-width="1" />
    <rect x="14" y="14" width="30" height="30" rx="8" fill="#ff0080" fill-opacity="0.15" />
    <text x="21" y="35" font-size="15">🔥</text>
    <text x="54" y="28" class="bento-header" fill="#ff0080">Optimal Runtime</text>
    <text x="54" y="44" class="bento-text" fill="#8b9bb4">Two Pointers, DP, Greedy</text>
    <text x="14" y="82" class="bento-text" fill="#f472b6">Minimizing overhead &amp; latency</text>
  </g>

  <!-- Box 3: Universal Growth -->
  <g transform="translate(570, 104)">
    <rect x="0" y="0" width="244" height="106" rx="12" fill="url(#bentoBg)" stroke="#1e2c45" stroke-width="1" />
    <rect x="14" y="14" width="30" height="30" rx="8" fill="#7928ca" fill-opacity="0.15" />
    <text x="21" y="35" font-size="15">🚀</text>
    <text x="54" y="28" class="bento-header" fill="#a855f7">Language-Agnostic</text>
    <text x="54" y="44" class="bento-text" fill="#8b9bb4">Multi-Paradigm Logic</text>
    <text x="14" y="82" class="bento-text" fill="#c084fc">Ever-expanding tech stack &amp; mastery</text>
  </g>

  <!-- Bottom Telemetry Footer -->
  <g transform="translate(36, 236)">
    <text x="0" y="0" font-family="'SF Mono', Consolas, monospace" font-size="11" fill="#586e8e">
      SYNC PIPELINE: <tspan fill="#00f2fe" font-weight="600">LEETHUB ➔ GITHUB REPOSITORY</tspan> • REPO: Pavel-Hasan-Joy/LeetCode-Solutions
    </text>
    <text x="778" y="0" text-anchor="end" font-family="'SF Mono', Consolas, monospace" font-size="11" font-weight="600" fill="#a855f7">
      VERIFIED CODE PROTOCOL ✓
    </text>
  </g>
</svg>
